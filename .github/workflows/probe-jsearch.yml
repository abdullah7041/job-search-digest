name: Probe JSearch response shape

# fetch_jsearch's docstring lists only the fields this repository has verified
# against a live /search-v2 response, and the alternative apply links the
# paid-relister recovery depends on are not among them. 7-8 postings a day are
# discarded for sitting on a paid wrapper; whether JSearch already hands over a
# free link for those has never been checked against a real payload.
#
# This runs `digest.py --probe-jsearch`, which reads one page and prints field
# names and link hosts. It delivers nothing, writes nothing back, and touches
# neither seen.json nor Discord. RAPIDAPI_KEY is used the same way the daily
# digest uses it and is never printed.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query to probe, e.g. data engineer Riyadh"
        required: false
        default: "data engineer Riyadh"
        type: string
      overlap_queries:
        description: "Semicolon-separated queries to compare instead, e.g. a;b;c"
        required: false
        default: ""
        type: string
      freshness_query:
        description: "Query to age-check across every date_posted value (3 requests)"
        required: false
        default: ""
        type: string
      active_ats:
        description: "Probe Active Jobs DB for Saudi ATS roles instead (1 request)"
        required: false
        default: false
        type: boolean
      linkedin:
        description: "Probe the LinkedIn feed for Saudi roles instead (1 request)"
        required: false
        default: false
        type: boolean
      indeed:
        description: "Probe the Indeed feed for Saudi roles instead (1 request)"
        required: false
        default: false
        type: boolean
      confirm_rapidapi_spend:
        description: "Set false to preview cost without spending; rerun true to confirm"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rapidapi-quota
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONFIRM_RAPIDAPI_SPEND: ${{ inputs.confirm_rapidapi_spend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install --require-hashes -r requirements.txt

      - name: Show predicted RapidAPI cost
        env:
          FRESHNESS_QUERY: ${{ inputs.freshness_query }}
          OVERLAP_QUERIES: ${{ inputs.overlap_queries }}
          ACTIVE_ATS: ${{ inputs.active_ats }}
          LINKEDIN: ${{ inputs.linkedin }}
          INDEED: ${{ inputs.indeed }}
        run: |
          costs=()
          if [[ -n "$FRESHNESS_QUERY" ]]; then costs+=("JSearch freshness: 3 requests"); fi
          if [[ -n "$OVERLAP_QUERIES" ]]; then
            IFS=';' read -r -a overlap_queries <<< "$OVERLAP_QUERIES"
            overlap_count=0
            for query in "${overlap_queries[@]}"; do
              if [[ -n "${query//[[:space:]]/}" ]]; then overlap_count=$((overlap_count + 1)); fi
            done
            costs+=("JSearch overlap: ${overlap_count} requests")
          fi
          if [[ "$ACTIVE_ATS" == "true" ]]; then costs+=("Active Jobs DB: 1 request"); fi
          if [[ "$LINKEDIN" == "true" ]]; then costs+=("LinkedIn Job Search: 1 request"); fi
          if [[ "$INDEED" == "true" ]]; then costs+=("Indeed: 1 request"); fi
          if [[ ${#costs[@]} -eq 0 ]]; then costs=("JSearch response shape: 1 request"); fi
          printf 'Predicted RapidAPI cost: %s\n' "${costs[@]}"

      - name: Refuse unconfirmed or non-main paid probes
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Paid RapidAPI probes are restricted to main; no request was made." >&2
            exit 1
          fi
          if [[ "$CONFIRM_RAPIDAPI_SPEND" != "true" ]]; then
            echo "Set confirm_rapidapi_spend to true to authorize a paid probe." >&2
            exit 1
          fi

      # QUERY is read from the environment, never interpolated into the script
      # body: a ${{ }} expression inside `run` is substituted before the shell
      # sees it, which turns a workflow input into arbitrary shell.
      # Three requests: the same query under each date_posted value, reporting the
      # age spread of what comes back. Answers whether the filter narrows anything.
      - name: Age-check one query across every date_posted value
        if: ${{ inputs.freshness_query }}
        env:
          QUERY: ${{ inputs.freshness_query }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python digest.py --probe-freshness "$QUERY"

      # A different API on the same RapidAPI account, so no new secret. A 403 here
      # means the key is not subscribed to it, which is an account action for the
      # operator rather than something this probe can do.
      - name: Ask Active Jobs DB what Saudi ATS roles exist this week
        if: ${{ inputs.active_ats }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python digest.py --probe-active-ats

      # A separate API on the same RapidAPI account, so a separate free
      # allowance and no new secret. 403 means the key is not subscribed to it.
      - name: Ask the LinkedIn feed what Saudi roles exist this week
        if: ${{ inputs.linkedin }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python digest.py --probe-linkedin

      # Indeed reaches employers none of the other feeds do. Its datePosted
      # shares a name with JSearch's and nothing more, so it is measured.
      - name: Ask the Indeed feed what Saudi roles exist this week
        if: ${{ inputs.indeed }}
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python digest.py --probe-indeed

      - name: Read one live JSearch page and report its shape
        if: ${{ !inputs.overlap_queries && !inputs.freshness_query && !inputs.active_ats && !inputs.linkedin && !inputs.indeed }}
        env:
          QUERY: ${{ inputs.query }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python digest.py --probe-jsearch "$QUERY"

      # One request per query. Splitting on ';' because a query contains spaces,
      # and reading it from the environment rather than interpolating it into
      # the script body, same as the input above.
      - name: Compare what several queries each bring in
        if: ${{ inputs.overlap_queries }}
        env:
          QUERIES: ${{ inputs.overlap_queries }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          IFS=';' read -r -a probe_queries <<< "$QUERIES"
          python digest.py --probe-queries "${probe_queries[@]}"

      - name: Commit only the updated quota ledger
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- active_ats.json
          if git diff --cached --quiet; then
            echo "no quota state change"
            exit 0
          fi
          git commit -m "update RapidAPI quota state [skip ci]"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Quota state could not be pushed after three safe retries." >&2
          exit 1
