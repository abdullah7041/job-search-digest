name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["seen.json", "stats.json", "jobs/**"]
  push:
    branches: [main]
    paths-ignore: ["seen.json", "stats.json", "jobs/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Run Python tests
        run: python -m unittest test_digest.py test_interactive.py test_workflow_guard.py test_fit_check.py test_eval.py

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Install pinned actionlint
        run: |
          curl --fail --location --show-error --silent --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.9/actionlint_1.7.9_linux_amd64.tar.gz
          echo "233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4  actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --file actionlint.tar.gz actionlint

      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
