name: job-digest

on:
  schedule:
    - cron: "0 4 * * *" # Daily target: 07:00 Riyadh; GitHub scheduling may be late.
  workflow_dispatch:
    inputs:
      use_rapidapi:
        description: "Use metered RapidAPI sources for this manual digest"
        required: false
        default: false
        type: boolean

concurrency:
  group: rapidapi-quota
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: python -m unittest test_search_preferences.py test_target_sources.py test_digest.py test_interactive.py test_workflow_guard.py test_fit_check.py test_strict_alerts.py
      - working-directory: worker
        run: npm test

  execute:
    needs: preflight
    runs-on: ubuntu-24.04
    # A job timeout is NOT graceful: it cancels the job outright, so the
    # package-state step never runs and seen.json never records cards Discord
    # already holds. Tomorrow then re-delivers them. digest.py bounds itself to
    # RUN_BUDGET_SECONDS + RANK_BUDGET_SECONDS + CHECK_BUDGET_SECONDS = 840s
    # before delivery, so this is the backstop rather than the expected outcome.
    # GitHub's own default is 360 minutes; the previous 10 was self-imposed.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INTERACTIVE_WORKER_URL: ${{ secrets.INTERACTIVE_WORKER_URL }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional overrides. An unset ${{ vars.X }} renders as an empty
          # string, which digest.py falls back from with `or`, never with the
          # two-argument os.environ.get.
          RANK_MODEL: ${{ vars.RANK_MODEL }}
          RANK_FALLBACK_MODELS: ${{ vars.RANK_FALLBACK_MODELS }}
          MIN_DELIVER_SCORE: ${{ vars.MIN_DELIVER_SCORE }}
          # The JSearch plan is 200 requests a MONTH and this run spends one per
          # rotating page-one query. digest.py validates the budget and defaults to 2.
          JSEARCH_DAILY_REQUESTS: ${{ vars.JSEARCH_DAILY_REQUESTS }}
          # Scheduled runs use the quota planner. Manual dispatches default to
          # direct employer boards only unless the operator explicitly opts in.
          RAPIDAPI_ENABLED: ${{ github.event_name == 'schedule' || inputs.use_rapidapi }}
          # The age cutoff in days. Achievable only against a source that can
          # supply it: measured 7 Sep 2026, JSearch returns nothing at all
          # inside a week, while the ATS feed returns 0-1 day old postings.
          MAX_JOB_AGE_DAYS: ${{ vars.MAX_JOB_AGE_DAYS }}
        run: python digest.py
      - name: Package generated state
        run: python workflow_guard.py package-state --root . --output state-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-artifact
          if-no-files-found: error
          retention-days: 7

  persist-state:
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: state-artifact
      - name: Verify and apply generated state
        run: python workflow_guard.py apply-state --artifact state-artifact --target .
      - name: Commit state with conflict-safe retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- seen.json stats.json boards.json active_ats.json jobs/
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "update state and job snapshots [skip ci]"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "State commit could not be pushed after three safe retries." >&2
          exit 1

  notify-failure:
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.execute.result == 'failure' || needs.persist-state.result == 'failure') }}
    needs: [preflight, execute, persist-state]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Send redacted failure alert
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          stage=preflight
          if [[ "${{ needs.execute.result }}" == "failure" ]]; then stage=execute; fi
          if [[ "${{ needs.persist-state.result }}" == "failure" ]]; then stage=persist-state; fi
          python workflow_guard.py notify --webhook "$DISCORD_WEBHOOK_URL" --workflow "job-digest" --stage "$stage" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --timestamp "$(date --iso-8601=seconds)"
