name: Interactive job task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Worker task identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: interactive-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: python -m unittest test_search_preferences.py test_target_sources.py test_digest.py test_interactive.py test_workflow_guard.py test_fit_check.py
      - working-directory: worker
        run: npm test
      - name: Retrieve, validate, and report task
        env:
          INTERACTIVE_WORKER_URL: ${{ secrets.INTERACTIVE_WORKER_URL }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Both are optional. resume_tailor falls back to its own defaults when
          # the variable is unset, which renders here as an empty string.
          TAILOR_MODEL: ${{ vars.TAILOR_MODEL }}
          TAILOR_FALLBACK_MODELS: ${{ vars.TAILOR_FALLBACK_MODELS }}
          # The chain that reads a screenshotted posting. Must be multimodal.
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          VISION_FALLBACK_MODELS: ${{ vars.VISION_FALLBACK_MODELS }}
          TASK_ID: ${{ inputs.task_id }}
        run: python interactive_runner.py
      - name: Send redacted failure alert
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python workflow_guard.py notify --webhook "$DISCORD_WEBHOOK_URL" --workflow "Interactive job task" --stage "run-task" --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --timestamp "$(date --iso-8601=seconds)"
